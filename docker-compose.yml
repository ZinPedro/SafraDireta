services:
  banco_dados:
    image: postgres:16
    environment:
      POSTGRES_USER: safra_app
      POSTGRES_PASSWORD: ${SAFRA_APP_PASSWORD:-safra_app_dev_only}
      POSTGRES_DB: safradireta
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      banco_dados:
        condition: service_healthy
    environment:
      PGHOST: banco_dados
      PGPORT: 5432
      PGDATABASE: safradireta
      PGUSER: safra_app
      PGPASSWORD: ${SAFRA_APP_PASSWORD:-safra_app_dev_only}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000

volumes:
  db_data: